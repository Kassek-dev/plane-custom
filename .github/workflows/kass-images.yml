# Kassek-dev variant of Plane 1.4.3: builds the custom images for all custom
# modules of this fork (currently: Team Availability).
#
# Trigger: push a git tag `1.4.3-kass.<n>` (e.g. `git tag 1.4.3-kass.1 && git push origin 1.4.3-kass.1`),
# or run manually for an existing tag. The image tag equals the git tag.
#
# Produces (linux/amd64):
#   ghcr.io/<owner>/plane-frontend:<tag>   (apps/web/Dockerfile.web, context = repo root)
#   ghcr.io/<owner>/plane-backend:<tag>    (apps/api/Dockerfile.api, context = apps/api)
#
# Packages must be switched to public once in GitHub (Package settings -> Change visibility)
# so the server can pull without logging in.

name: Kass variant images

on:
  push:
    tags:
      - "1.4.3-kass.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to (re)build, e.g. 1.4.3-kass.1"
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: kass-images-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  verify:
    name: Verify tag and custom module tests
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag format
        run: |
          if ! printf '%s' "$RELEASE_TAG" | grep -Eq '^1\.4\.3-kass\.[0-9]+$'; then
            echo "::error::Tag '$RELEASE_TAG' does not match 1.4.3-kass.<n>"
            exit 1
          fi

      - name: Checkout tag
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.18.0"

      # Add the unit tests of every new custom module here
      - name: "Module tests: Team Availability (4 time zones)"
        working-directory: apps/web
        run: node core/team-availability/test/run.mjs

  build:
    name: Build and push plane-${{ matrix.image }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - image: frontend
            context: .
            dockerfile: apps/web/Dockerfile.web
            title: "Plane frontend (Kassek-dev variant)"
          - image: backend
            context: apps/api
            dockerfile: apps/api/Dockerfile.api
            title: "Plane backend (Kassek-dev variant)"
    steps:
      - name: Checkout tag
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Resolve image name and commit
        id: meta
        run: |
          owner="$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/plane-${{ matrix.image }}" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7.0.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ env.RELEASE_TAG }}
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=Plane Community Edition 1.4.3, Kassek-dev variant with custom modules
            org.opencontainers.image.vendor=Kassek-dev
            org.opencontainers.image.authors=Kassek-dev
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.revision }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}/tree/${{ env.RELEASE_TAG }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          cache-from: type=gha,scope=plane-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=plane-${{ matrix.image }}
